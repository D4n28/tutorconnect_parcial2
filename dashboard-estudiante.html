<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TutorConnect - Dashboard Estudiante</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Barra Superior -->
  <div id="navbar-container"></div>

  <!-- Contenedor Principal -->
  <main class="main-container">
    <div style="margin-bottom: 1.5rem;">
      <h1 style="font-size: 1.6rem; font-weight: 800; color: var(--text-main);">Encuentra a tu tutor ideal</h1>
      <p style="color: var(--text-muted); font-size: 0.95rem;">Explora tutores certificados disponibles para clases personalizadas.</p>
    </div>

    <!-- Layout: Sidebar con Filtros + Grilla de Tutores (Página 3 del prototipo) -->
    <div class="student-dashboard-layout">
      
      <!-- Filtros Laterales (En móvil se adaptan como acordeón o menú) -->
      <aside class="filter-sidebar">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
          <h2 style="font-size: 1.1rem; font-weight: 700;">Filtros</h2>
          <button type="button" onclick="limpiarFiltros()" class="btn-outline btn-sm" style="border: none; color: var(--primary); font-weight: 600;">Limpiar</button>
        </div>

        <div style="margin-bottom: 1.25rem;">
          <label style="font-size: 0.85rem; font-weight: 600; display: block; margin-bottom: 0.4rem;">Materia</label>
          <select id="filtroMateria" onchange="aplicarFiltros()">
            <option value="">Todas las materias</option>
            <option value="Matemáticas">Matemáticas / Cálculo</option>
            <option value="Física">Física</option>
            <option value="Química">Química</option>
            <option value="Programación">Programación / Web</option>
            <option value="Idiomas">Idiomas / Inglés</option>
            <option value="Economía">Economía y Finanzas</option>
          </select>
        </div>

        <div style="margin-bottom: 1.25rem;">
          <label style="font-size: 0.85rem; font-weight: 600; display: block; margin-bottom: 0.4rem;">Nivel Educativo</label>
          <select id="filtroNivel" onchange="aplicarFiltros()">
            <option value="">Todos los niveles</option>
            <option value="Secundaria">Secundaria</option>
            <option value="Universidad">Universidad</option>
          </select>
        </div>

        <div style="margin-bottom: 1.25rem;">
          <label style="font-size: 0.85rem; font-weight: 600; display: block; margin-bottom: 0.4rem;">Modalidad</label>
          <select id="filtroModalidad" onchange="aplicarFiltros()">
            <option value="">Cualquier modalidad</option>
            <option value="Virtual">Solo Virtual</option>
            <option value="presencial">Presencial / Ambas</option>
          </select>
        </div>

        <div style="margin-bottom: 1.25rem;">
          <label style="font-size: 0.85rem; font-weight: 600; display: block; margin-bottom: 0.4rem;">Disponibilidad</label>
          <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; cursor: pointer;">
            <input type="checkbox" id="filtroDisponible" onchange="aplicarFiltros()" style="width: auto;">
            <span>Solo disponibles ahora (verde)</span>
          </label>
        </div>

        <div style="margin-bottom: 1rem;">
          <label style="font-size: 0.85rem; font-weight: 600; display: block; margin-bottom: 0.4rem;">Precio máximo por hora: <span id="labelPrecioMax">$50</span></label>
          <input type="range" id="filtroPrecio" min="10" max="60" value="50" step="5" oninput="actualizarLabelPrecio(this.value)" onchange="aplicarFiltros()">
        </div>
      </aside>

      <!-- Sección de Resultados de Tutores -->
      <section>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
          <div style="font-size: 0.95rem; color: var(--text-muted);">
            Mostrando <strong id="contadorTutores">0</strong> tutores disponibles
          </div>
          <div style="display: flex; gap: 0.5rem; align-items: center;">
            <span style="font-size: 0.85rem; color: var(--text-muted);">Ordenar por:</span>
            <select id="ordenarPor" onchange="aplicarFiltros()" style="width: auto; padding: 0.4rem 0.6rem;">
              <option value="rating">Mayor Calificación</option>
              <option value="precio_bajo">Menor Precio</option>
              <option value="precio_alto">Mayor Precio</option>
            </select>
          </div>
        </div>

        <!-- Grilla de Tarjetas -->
        <div class="tutors-grid" id="tutorsGrid">
          <!-- Inyectado dinámicamente -->
        </div>

        <!-- Botón Ver Más (Página 3 del prototipo) -->
        <div style="text-align: center; margin-top: 2rem;" id="verMasContainer">
          <button type="button" class="btn btn-outline" onclick="cargarMasTutores()">
            Ver más tutores
          </button>
        </div>
      </section>

    </div>
  </main>

  <!-- Navegación Móvil Inferior -->
  <div id="mobile-bottom-nav"></div>

  <!-- Pie de página con créditos -->
  <div id="app-footer"></div>

  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
  <script>
    let cantidadTutoresVisibles = 6;

    function renderizarTutores(lista) {
      const grilla = document.getElementById('tutorsGrid');
      document.getElementById('contadorTutores').textContent = lista.length;

      if (lista.length === 0) {
        grilla.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 3rem; background: white; border-radius: 12px; border: 1px dashed #cbd5e1;">
            <p style="font-size: 1.1rem; color: var(--text-muted); margin-bottom: 1rem;">No se encontraron tutores con los filtros seleccionados.</p>
            <button class="boton boton-primario boton-sm" onclick="limpiarFiltros()">Restablecer filtros</button>
          </div>
        `;
        document.getElementById('verMasContainer').style.display = 'none';
        return;
      }

      const elementos = lista.slice(0, cantidadTutoresVisibles);
      grilla.innerHTML = elementos.map(t => `
        <article class="tarjeta tarjeta-tutor card tutor-card">
          <div class="encabezado-tarjeta-tutor tutor-card-header">
            <img src="${t.foto}" alt="${t.nombre}" class="avatar-tutor tutor-avatar">
            <div class="info-tutor-encabezado tutor-header-info">
              <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                <h3 class="nombre-tutor tutor-name">${t.nombre}</h3>
                <span class="placa-estado ${t.disponible ? 'placa-disponible' : 'placa-ocupado'} badge ${t.disponible ? 'badge-online' : 'badge-busy'}" title="${t.disponible ? 'Disponible para reservar' : 'Horarios ocupados actualmente'}">
                  <span class="indicador-punto badge-dot-indicator"></span>
                  ${t.disponible ? 'Disponible' : 'Ocupado'}
                </span>
              </div>
              <div class="especialidad-tutor tutor-specialty">${t.especialidad}</div>
              <div class="estrellas-calificacion rating-stars">
                <span>★</span>
                <span class="puntaje-calificacion rating-score">${t.calificacion.toFixed(1)}</span>
                <span class="total-resenas-texto rating-count">(${t.totalResenas} reseñas)</span>
              </div>
            </div>
          </div>

          <p style="font-size: 0.85rem; color: var(--text-muted); line-height: 1.4; margin-bottom: 0.75rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
            ${t.sobreMi}
          </p>

          <div class="metadatos-tutor tutor-meta">
            <div class="item-metadato tutor-meta-item">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
              <span>${t.modalidad}</span>
            </div>
            <div class="item-metadato tutor-meta-item">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
              <span>${t.experiencia}</span>
            </div>
          </div>

          <div class="pie-tarjeta-tutor tutor-card-footer">
            <div class="etiqueta-precio tutor-price-tag">
              $${t.precio} <span>/ hora</span>
            </div>
            <a href="tutor-perfil.html?id=${t.id}" class="boton boton-primario boton-sm btn btn-primary btn-sm">
              Ver perfil
            </a>
          </div>
        </article>
      `).join('');

      document.getElementById('verMasContainer').style.display = lista.length > cantidadTutoresVisibles ? 'block' : 'none';
    }

    function aplicarFiltros() {
      const materia = document.getElementById('filtroMateria').value.toLowerCase();
      const nivel = document.getElementById('filtroNivel').value.toLowerCase();
      const modalidad = document.getElementById('filtroModalidad').value.toLowerCase();
      const soloDisponibles = document.getElementById('filtroDisponible').checked;
      const precioMaximo = parseFloat(document.getElementById('filtroPrecio').value);
      const criterioOrden = document.getElementById('ordenarPor').value;
      const elementoBuscador = document.getElementById('buscadorGlobal') || document.getElementById('globalNavSearch');
      const consultaBuscador = (elementoBuscador ? elementoBuscador.value : '').toLowerCase().trim();

      let tutoresFiltrados = BaseDatosTutor.obtenerTutores().filter(t => {
        const coincideMateria = !materia || t.materias.some(m => m.toLowerCase().includes(materia)) || t.especialidad.toLowerCase().includes(materia);
        const coincideNivel = !nivel || t.nivel.toLowerCase().includes(nivel);
        const coincideModalidad = !modalidad || t.modalidad.toLowerCase().includes(modalidad);
        const coincideDisponibilidad = !soloDisponibles || t.disponible === true;
        const coincidePrecio = t.precio <= precioMaximo;
        const coincideBusqueda = !consultaBuscador || 
          t.nombre.toLowerCase().includes(consultaBuscador) || 
          t.especialidad.toLowerCase().includes(consultaBuscador) ||
          t.materias.some(m => m.toLowerCase().includes(consultaBuscador));

        return coincideMateria && coincideNivel && coincideModalidad && coincideDisponibilidad && coincidePrecio && coincideBusqueda;
      });

      if (criterioOrden === 'rating') {
        tutoresFiltrados.sort((a, b) => b.calificacion - a.calificacion);
      } else if (criterioOrden === 'precio_bajo') {
        tutoresFiltrados.sort((a, b) => a.precio - b.precio);
      } else if (criterioOrden === 'precio_alto') {
        tutoresFiltrados.sort((a, b) => b.precio - a.precio);
      }

      renderizarTutores(tutoresFiltrados);
    }

    function actualizarEtiquetaPrecio(valor) {
      document.getElementById('labelPrecioMax').textContent = `$${valor}`;
    }

    function limpiarFiltros() {
      document.getElementById('filtroMateria').value = '';
      document.getElementById('filtroNivel').value = '';
      document.getElementById('filtroModalidad').value = '';
      document.getElementById('filtroDisponible').checked = false;
      document.getElementById('filtroPrecio').value = 50;
      actualizarEtiquetaPrecio(50);
      cantidadTutoresVisibles = 6;
      aplicarFiltros();
    }

    function cargarMasTutores() {
      cantidadTutoresVisibles += 6;
      aplicarFiltros();
    }

    // Aliases para compatibilidad
    function renderTutores(l) { renderizarTutores(l); }
    function actualizarLabelPrecio(v) { actualizarEtiquetaPrecio(v); }

    document.addEventListener("DOMContentLoaded", () => {
      aplicarFiltros();
      
      const entradaBuscador = document.getElementById('buscadorGlobal') || document.getElementById('globalNavSearch');
      if (entradaBuscador) {
        entradaBuscador.addEventListener('input', aplicarFiltros);
      }
    });
  </script>
</body>
</html>
